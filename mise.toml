# Toolchain pins and task runner for the cell-ledger monorepo.
# `mise install` installs every tool below; `mise run <task>` runs a task.

[tools]
python = "3.13"
uv = "0.9"
bun = "1.3"
node = "24" # Playwright's runner and browser installer still assume Node

[env]
_.path = ["{{config_root}}/.venv/bin"]
PYTHONDONTWRITEBYTECODE = "1"

# ---------------------------------------------------------------- setup

[tasks.setup]
description = "Install Python and JS dependencies plus Playwright's Chromium"
run = [
  "uv sync",
  "bun install",
  "bun run --cwd apps/web playwright install chromium",
]

# ------------------------------------------------------------------ dev

[tasks."dev:api"]
description = "FastAPI with auto-reload on :8000"
run = "uv run uvicorn cell_ledger_api.main:app --reload --port 8000"

[tasks."dev:web"]
description = "Vite dev server on :5173 (proxies /api to :8000)"
run = "bun run --cwd apps/web dev"

[tasks.dev]
description = "Run api and web together"
depends = ["dev:api", "dev:web"]

# ----------------------------------------------------------------- lint

[tasks."lint:py"]
description = "Ruff lint + format check, pyright"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pyright",
]

[tasks."lint:web"]
description = "Biome lint + format check, tsc"
run = ["bun run biome ci .", "bun run --cwd apps/web typecheck"]

[tasks.lint]
depends = ["lint:py", "lint:web"]

[tasks.fmt]
description = "Auto-format everything"
run = ["uv run ruff check --fix .", "uv run ruff format .", "bun run biome check --write ."]

# ----------------------------------------------------------------- test

[tasks."test:py"]
run = "uv run pytest"

[tasks."test:web"]
run = "bun run --cwd apps/web test"

[tasks.test]
depends = ["test:py", "test:web"]

[tasks.e2e]
description = "Playwright end-to-end tests (boots api and web itself)"
run = "bun run --cwd apps/web e2e"

# ------------------------------------------------------------ codegen

[tasks."gen:api"]
description = "Export FastAPI's OpenAPI schema and regenerate the TS client"
run = [
  "uv run python -m cell_ledger_api.openapi apps/web/openapi.json",
  "bun run --cwd apps/web gen:api",
]

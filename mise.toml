# Toolchain pins and task runner for the cell-ledger monorepo.
# `mise install` installs every tool below; `mise run <task>` runs a task.

[tools]
python = "3.13"
uv = "0.9"
bun = "1.3"
node = "24" # Playwright's runner and browser installer still assume Node

[env]
_.path = ["{{config_root}}/.venv/bin"]
PYTHONDONTWRITEBYTECODE = "1"

# ---------------------------------------------------------------- setup

[tasks.setup]
description = "Install Python and JS dependencies plus Playwright's Chromium"
run = [
  "uv sync",
  "bun install",
  "bun run --cwd apps/web playwright install chromium",
]

# ------------------------------------------------------------- supabase
# The API needs Postgres and Storage to start. Locally that is this stack (Docker), on the
# ports in supabase/config.toml; it applies supabase/migrations and creates the bucket, so it
# is the same database and bucket the cloud project has. Tests run against it too.

[tasks."supabase:start"]
description = "Local Supabase: Postgres on :57322, Storage/API on :57321, Studio on :57323"
run = "supabase start -x realtime,edge-runtime,vector,logflare,imgproxy,supavisor,mailpit"

[tasks."supabase:stop"]
run = "supabase stop"

[tasks."supabase:reset"]
description = "Wipe the local database and re-apply every migration (also recreates the bucket)"
run = "supabase db reset"

[tasks."supabase:status"]
run = "supabase status"

[tasks."db:migration"]
description = "Create an empty migration: mise run db:migration -- add_thing"
run = "supabase migration new \"$@\""

[tasks."db:push"]
description = "Apply pending migrations to the linked cloud project (see docs/deploy.md)"
run = "supabase db push"

# ------------------------------------------------------------------ dev

[tasks."dev:api"]
description = "FastAPI with auto-reload on :8000"
run = "uv run uvicorn --factory cell_ledger_api.main:create_app --reload --port 8000"

[tasks."dev:web"]
description = "Vite dev server on :5173 (proxies /api to :8000)"
run = "bun run --cwd apps/web dev"

[tasks.dev]
description = "Run api and web together (start the stack first: mise run supabase:start)"
depends = ["dev:api", "dev:web"]

# ----------------------------------------------------------------- lint

[tasks."lint:py"]
description = "Ruff lint + format check, pyright"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pyright",
]

[tasks."lint:web"]
description = "Biome lint + format check, tsc"
run = ["bun run biome ci .", "bun run --cwd apps/web typecheck"]

[tasks.lint]
depends = ["lint:py", "lint:web"]

[tasks.fmt]
description = "Auto-format everything"
run = ["uv run ruff check --fix .", "uv run ruff format .", "bun run biome check --write ."]

# ----------------------------------------------------------------- test

[tasks."test:py"]
description = "pytest (API tests need the local Supabase stack running)"
run = "uv run pytest"

[tasks."test:web"]
run = "bun run --cwd apps/web test"

[tasks.test]
depends = ["test:py", "test:web"]

# ----------------------------------------------------------------- evals
# Discovery evals (evals/README.md): the specialist and a web-search baseline on the same cases.

[tasks.eval]
description = "Run the discovery evals: mise run eval -- --system both [--case ID] [--repeats 3]"
run = "uv run python -m evals.run run \"$@\""

[tasks."eval:validate"]
description = "Check every case file in evals/cases"
run = "uv run python -m evals.run validate"

[tasks."eval:score"]
description = "Re-score saved runs: mise run eval:score -- data/evals/runs/<run_id>"
run = "uv run python -m evals.run score \"$@\""

[tasks."eval:show"]
description = "A series as the agent reads it, plus every GSM and its count coverage: mise run eval:show -- GSE262627"
run = "uv run python -m evals.run show \"$@\""

[tasks."eval:queue"]
description = "Candidates waiting for a human relevance verdict"
run = "uv run python -m evals.run queue"

[tasks.e2e]
description = "Playwright end-to-end tests (boots api and web itself; needs the local stack)"
run = "bun run --cwd apps/web e2e"

# ----------------------------------------------------------- analysis

[tasks."data:fetch"]
description = "Download the example and query-set GEO datasets into data/geo (gitignored)"
run = "uv run python scripts/fetch_geo_examples.py"

[tasks.analyze]
description = "Run the pipeline: mise run analyze -- GSE82227 [--genes CXCL9] | mise run analyze -- --all"
run = """
if [ "$1" = "--all" ]; then shift; uv run cell-ledger run-all "$@"; else uv run cell-ledger run "$@"; fi
"""

[tasks.compare]
description = "Run a query set end to end: mise run compare -- hcc_tumor_vs_adjacent [--skip-existing]"
run = "uv run cell-ledger run-set \"$@\""

[tasks."validate:published"]
description = "Rerun the published-DE validation (docs/validation): fetch, build designs, run, compare, export"
run = """
uv run python scripts/validation/fetch_published.py
uv run python scripts/validation/build_designs.py
for gse in GSE52778 GSE147507 GSE144269; do
  uv run cell-ledger run "$gse" --design "scripts/validation/designs/$gse.json" --no-enrichment "$@"
done
uv run python scripts/validation/compare_published.py
uv run python scripts/validation/export_web_data.py
bun run biome check --write apps/web/src/lib/validation-results.ts
"""

# ---------------------------------------------------------- production
# Everything below runs the app the way Fly runs it: one uvicorn worker serving /api and the
# built UI from one origin, settings from CELL_LEDGER_* only. Use these before every deploy.

[tasks."build:web"]
description = "Build the frontend into apps/web/dist"
run = "bun run --cwd apps/web build"

[tasks.serve]
description = "Production-shaped server on :8000 from the local venv (API + built UI, no reload)"
depends = ["build:web"]
env = { CELL_LEDGER_WEB_DIST = "apps/web/dist" }
run = "uv run uvicorn --factory cell_ledger_api.main:create_app --host 0.0.0.0 --port 8000 --workers 1"

[tasks."docker:build"]
description = "Build the exact image Fly deploys (tag cell-ledger:local)"
run = "docker build -t cell-ledger:local ."

[tasks."docker:run"]
description = "Run the image on :8000 with .env and ./data mounted at /data, like the Fly volume"
depends = ["docker:build"]
shell = "bash -c"
# A .env pointing at the local stack (127.0.0.1) is rewritten to host.docker.internal so the
# container can reach it. Signed URLs then carry that host too, so open them from the API box
# or point .env at the cloud project when you want to click through from a browser.
run = """
docker run --rm -it -p 8000:8000 \
  --env-file <(sed 's/127\\.0\\.0\\.1/host.docker.internal/g' .env) \
  --add-host=host.docker.internal:host-gateway \
  -e CELL_LEDGER_DATA_DIR=/data -e CELL_LEDGER_WEB_DIST=/app/web -e CELL_LEDGER_CORS_ORIGINS='[]' \
  -v "$PWD/data:/data" cell-ledger:local
"""

[tasks.deploy]
description = "lint, test, build the image, push migrations, then deploy to Fly (single machine)"
depends = ["lint", "test", "docker:build"]
run = ["supabase db push", "fly deploy --ha=false"]

[tasks."deploy:logs"]
run = "fly logs"

# ------------------------------------------------------------ codegen

[tasks."gen:api"]
description = "Export FastAPI's OpenAPI schema and regenerate the TS client"
run = [
  "uv run python -m cell_ledger_api.openapi apps/web/openapi.json",
  "bun run --cwd apps/web gen:api",
]

[project]
name = "cell-ledger-workspace"
version = "0.0.0"
description = "Workspace root; see packages/core and apps/api"
requires-python = ">=3.13,<3.14"
dependencies = ["cell-ledger", "cell-ledger-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/core"]

[tool.uv.sources]
cell-ledger = { workspace = true }
cell-ledger-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "httpx>=0.28",
  "ruff>=0.14",
  "pyright>=1.1",
  "httpx2>=2.16.0",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cell_ledger", "cell_ledger_api"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs the local GEO downloads and takes tens of seconds"]

# --------------------------------------------------------------- pyright
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["packages/core/src", "apps/api/src", "packages/core/tests", "apps/api/tests"]
typeCheckingMode = "standard"

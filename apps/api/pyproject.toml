[project]
name = "cell-ledger-api"
version = "0.1.0"
description = "FastAPI service and agent runtime for cell-ledger"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cell-ledger",
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "pydantic-settings>=2.10",
  "anthropic>=2.6.0",
  "exa-py>=2.28.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: uv sync --locked
      - run: mise run lint:py
      - run: mise run test:py

  web:
    name: Web lint + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - run: mise run lint:web
      - run: mise run test:web
      - run: bun run --cwd apps/web build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web playwright install --with-deps chromium
      - run: mise run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

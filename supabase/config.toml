# Local Supabase stack for cell-ledger: Postgres (the source of truth for sessions, datasets
# and runs) plus Storage (session files). `mise run supabase:start` boots it; the migrations
# in ./migrations and the bucket below are applied on start, so local and cloud match.
# Ports are 573xx so this stack can run beside other projects' default 543xx stacks.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "cell-ledger"

[api]
enabled = true
port = 57321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 57322
shadow_port = 57320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 57323
api_url = "http://127.0.0.1"

[storage]
enabled = true
# Supabase's free plan caps objects at 50 MB; keep local the same so an oversized counts
# file fails here the way it fails in the cloud. Raise both together on a paid plan.
file_size_limit = "50MiB"

# Private bucket for per-session files: <session>/geo/<GSE>/<file>, <session>/runs/<GSE>/<contrast>/<file>.
[storage.buckets.sessions]
public = false

# Everything below is unused by cell-ledger.
[auth]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false

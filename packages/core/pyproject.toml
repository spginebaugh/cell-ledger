[project]
name = "cell-ledger"
version = "0.1.0"
description = "Find, triage, harmonize and analyze public GEO RNA-seq datasets"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11",
  "httpx>=0.28",
  "pandas>=2.2",
  "numpy>=2.1",
  "anndata>=0.11",
  "scanpy>=1.11",
  "pydeseq2>=0.5",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
